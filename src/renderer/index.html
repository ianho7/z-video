<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'" />
    <title>z-video · 本地片库</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell" data-view="library">
      <header class="app-header">
        <div class="brand-lockup" aria-label="z-video 本地片库">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><strong>z-video</strong><small>本地片库</small></span>
        </div>
        <nav class="top-nav" aria-label="浏览"><button type="button" data-nav="home" aria-current="page">首页</button><button type="button" data-nav="all">全部</button><button type="button" data-nav="movie">电影</button><button type="button" data-nav="show">剧集</button></nav>
        <span id="scan-status" class="scan-status" role="status" aria-live="polite"></span>
        <form id="library-search-form" class="search-box" role="search"><span aria-hidden="true">⌕</span><input id="library-search-input" type="search" autocomplete="off" placeholder="搜索片名、剧集" aria-label="搜索片名、剧集" /><button id="library-search-clear" class="icon-button" type="button" hidden aria-label="清除搜索">×</button></form>
        <details class="add-menu"><summary aria-label="添加">+</summary><div class="header-actions">
          <button id="choose-folder-button" class="secondary-button" type="button">添加文件夹</button>
          <button id="scan-folder-button" class="secondary-button" type="button">扫描目录</button>
          <button id="open-video-button" class="primary-button" type="button">打开视频</button>
          <button id="manage-sources-button" class="secondary-button" type="button">管理来源</button>
        </div></details>
      </header>

      <main class="library-layout">
        <aside class="source-sidebar" aria-label="本地片库来源" hidden>
          <p class="eyebrow">SOURCES</p>
          <h2>我的来源</h2>
          <button id="all-sources-button" class="source-all" type="button" aria-pressed="true">全部来源 <span id="all-source-count">0</span></button>
          <div id="source-list" class="source-list" role="list"></div>
          <p class="muted source-note">媒体只读；移除来源只清理应用索引，不删除源文件。</p>
        </aside>

        <section class="library-content" aria-labelledby="library-title">
          <div class="content-heading">
            <div>
              <p class="eyebrow">LOCAL LIBRARY</p>
              <h1 id="library-title">片库</h1>
            </div>
          </div>

          <div class="library-toolbar">
            <button id="cancel-scan-button" class="secondary-button compact-button" type="button" hidden>取消扫描</button>
          </div>

          <div id="library-message" class="status" role="status" aria-live="polite"></div>

          <section id="home-hero" class="home-hero" hidden><div id="hero-artwork" class="hero-artwork"></div><div class="hero-copy"><p id="hero-label" class="eyebrow"></p><h1 id="hero-title"></h1><div class="hero-episode"><strong id="hero-episode"></strong><span id="hero-meta"></span></div><svg class="hero-progress" viewBox="0 0 360 18" preserveAspectRatio="none" aria-hidden="true"><path id="hero-progress-track"/><path id="hero-progress-fill" pathLength="100"/></svg><div class="hero-actions"><button id="hero-play" class="primary-button" type="button">继续观看</button><button id="hero-restart" class="secondary-button" type="button">从头播放</button><button id="hero-detail" class="secondary-button" type="button">详情</button></div></div></section>
          <section id="continue-section" class="continue-section" hidden aria-labelledby="continue-title">
            <div class="section-heading"><h2 id="continue-title">继续观看</h2><span id="continue-scope" class="muted"></span><button type="button" data-shelf="all">查看全部 →</button></div>
            <div id="continue-row" class="continue-row"></div>
          </section>

          <section id="recent-section" class="home-shelf" hidden><div class="section-heading"><h2>最近添加</h2><button type="button" data-shelf="recent">查看全部 →</button></div><div id="recent-row" class="shelf-row"></div></section>
          <section id="shows-section" class="home-shelf" hidden><div class="section-heading"><h2>剧集</h2><button type="button" data-shelf="show">查看全部 →</button></div><div id="shows-row" class="shelf-row"></div></section>
          <section id="collection-section" aria-labelledby="collection-title">
            <div class="section-heading all-media-heading"><h1 id="collection-title">全部媒体</h1><span id="page-scope" class="muted"></span></div>
            <div class="library-toolbar all-media-toolbar">
              <div id="library-filter-buttons" class="segmented-control" role="group" aria-label="类型">
                <button type="button" data-filter="all" aria-pressed="true">全部</button>
                <button type="button" data-filter="movie" aria-pressed="false">电影</button>
                <button type="button" data-filter="show" aria-pressed="false">电视剧</button>
                <button type="button" data-filter="episode" aria-pressed="false">剧集</button>
                <button type="button" data-filter="unclassified" aria-pressed="false">未分类</button>
              </div>
              <div id="library-source-filters" class="source-filters" role="group" aria-label="来源"></div>
              <label class="sort-control">排序
                <select id="library-sort" class="library-select">
                  <option value="recent">最近更新</option>
                  <option value="added_desc">最近添加</option>
                  <option value="title">标题</option>
                  <option value="year_desc">年份</option>
                  <option value="score_desc">评分</option>
                </select>
              </label>
              <select id="library-filter" class="sr-only" aria-hidden="true" tabindex="-1">
                <option value="all">全部</option><option value="movie">电影</option><option value="show">电视剧</option><option value="episode">剧集</option><option value="unclassified">未分类</option>
              </select>
            </div>
            <div id="library-grid" class="library-grid" role="list" aria-live="polite"></div>
            <div id="library-empty" class="empty-state" hidden>
              <h2 id="library-empty-title">还没有本地影片</h2>
              <p id="library-empty-message">选择一个文件夹开始索引，或直接打开一个视频文件。</p>
              <button id="search-all-types-button" class="primary-button" type="button" hidden>搜索全部类型</button>
              <button id="library-retry-button" class="secondary-button" type="button" hidden>重试</button>
            </div>
            <nav id="library-pagination" class="library-pagination" aria-label="片库分页"></nav>
          </section>

          <section id="media-detail" class="media-detail" hidden aria-labelledby="media-detail-title">
            <button id="media-detail-back" class="text-button" type="button">← 返回片库</button>
            <div class="detail-layout">
              <div id="detail-poster" class="detail-poster"><span class="poster-fallback">封面不可用</span></div>
              <div class="detail-copy">
                <p class="eyebrow">MEDIA DETAIL</p>
                <h2 id="media-detail-title"></h2>
                <p id="media-detail-meta" class="muted"></p>
                <div class="detail-actions">
                  <button id="media-detail-open" class="primary-button" type="button">播放</button>
                  <button id="media-detail-restart" class="secondary-button" type="button" hidden>从头播放</button>
                  <span id="media-detail-resume" class="detail-resume" hidden></span>
                  <span id="detail-availability" class="muted"></span>
                </div>
                <details id="media-detail-plot-section" class="detail-plot-section">
                  <summary>剧情简介</summary>
                  <p id="media-detail-plot" class="detail-plot"></p>
                </details>
                <section id="detail-episodes-section" hidden aria-labelledby="detail-episodes-title">
                  <h3 id="detail-episodes-title">剧集</h3>
                  <div id="detail-episodes" class="episode-list"></div>
                </section>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>
    <section class="player-view" data-view="player" hidden aria-label="播放器">
      <main class="player-shell">
        <div class="player-surface" aria-label="原生视频区域" aria-keyshortcuts="Space ArrowLeft ArrowRight ArrowUp ArrowDown M F Escape" title="视频区域快捷键：Space 暂停 · ←/→ 前后 5 秒 · ↑/↓ 音量 ±5 · M 静音 · F 全屏 · Esc 退出全屏" tabindex="-1">
          <p id="player-surface-message" class="player-surface-message">正在准备原生播放器…</p>
        </div>
        <div class="player-controls" aria-label="播放控制">
          <div class="player-control-row">
            <button id="player-close-button" class="secondary-button" type="button">返回片库</button>
            <span class="player-now-playing" aria-live="polite"><span>正在播放</span><strong id="player-current-title"></strong></span>
            <button id="player-toggle-button" class="primary-button" type="button" aria-keyshortcuts="Space" title="Space" disabled>播放</button>
            <label class="seek-control" for="player-seek"><span class="sr-only">播放进度</span><input id="player-seek" type="range" min="0" max="0" value="0" step="0.1" aria-keyshortcuts="ArrowLeft ArrowRight" title="视频区域焦点时 ←/→ 前后 5 秒；滑块聚焦时微调" disabled /></label>
            <span id="player-time" class="player-time" aria-live="off">00:00 / 00:00</span>
            <label class="player-speed-control" for="player-speed"><span>倍速</span><select id="player-speed" aria-label="播放倍速" disabled>
              <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option>
            </select></label>
            <button id="player-fullscreen-button" class="secondary-button" type="button" aria-keyshortcuts="F" title="F" disabled>全屏</button>
          </div>
          <div class="player-control-row player-secondary-row">
            <label for="player-audio-track">音轨</label><select id="player-audio-track" disabled><option value="">自动</option></select>
            <label for="player-subtitle-track">字幕</label><select id="player-subtitle-track" disabled><option value="">关闭</option></select>
            <button id="player-subtitle-file-button" class="secondary-button" type="button" title="加载外部字幕" disabled>加载字幕</button>
            <label class="player-volume-control" for="player-volume"><span>音量</span><input id="player-volume" type="range" min="0" max="100" step="5" value="100" aria-keyshortcuts="ArrowUp ArrowDown" title="↑ / ↓：音量 ±5" disabled /></label>
            <button id="player-mute-button" class="secondary-button" type="button" aria-keyshortcuts="M" aria-pressed="false" title="M" disabled>静音</button>
            <span id="player-status" class="status" role="status" aria-live="polite"></span>
          </div>
        </div>
      </main>
    </section>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
