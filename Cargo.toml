[package]
name = "z-video"
version = "0.1.0"
edition = "2021"
description = "LAN video client for Zidoo/Z-Space NAS"

[dependencies]
slint = { version = "1.9.2", features = ["compat-1-2", "raw-window-handle-06"] }
raw-window-handle = "0.6"
libloading = "0.8"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
slint-build = "1.9.2"
