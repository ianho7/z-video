[package]
name = "z-video"
version = "0.1.0"
edition = "2021"
description = "LAN video client for Zidoo/Z-Space NAS"

[dependencies]
raw-window-handle = "0.6"
libloading = "0.8"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rsa = { version = "0.9", features = ["pem"] }
base64 = "0.22"
ureq = { version = "2.10", features = ["json"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native"] }
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# The new Slint compiler is required on both targets because 1.18.1 does not
# parse backdrop-blur. Resolver 2 keeps target-specific renderer features
# scoped: Windows selects Skia; non-Windows keeps the default renderer set.
[target.'cfg(windows)'.dependencies]
slint = { git = "https://github.com/slint-ui/slint.git", rev = "0ade85bfd0a88b6de2f87f767420975f98c141d0", default-features = false, features = ["compat-1-2", "accessibility", "backend-winit", "renderer-skia", "raw-window-handle-06"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(not(windows))'.dependencies]
slint = { git = "https://github.com/slint-ui/slint.git", rev = "0ade85bfd0a88b6de2f87f767420975f98c141d0", features = ["compat-1-2", "raw-window-handle-06"] }

[target.'cfg(windows)'.build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint.git", rev = "0ade85bfd0a88b6de2f87f767420975f98c141d0", default-features = false, features = ["compat-1-18"] }

[target.'cfg(not(windows))'.build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint.git", rev = "0ade85bfd0a88b6de2f87f767420975f98c141d0" }

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.test]
debug = 1
split-debuginfo = "unpacked"
